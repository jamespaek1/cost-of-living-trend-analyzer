# Auto-refresh the dashboard's live data on a schedule.
#
# SETUP: commit this workflow. It runs daily and can be triggered manually
#      (Actions tab -> "Refresh live data" -> Run workflow).
#
# WHAT IT DOES: runs fetch_cost_of_living.py (live FRED CPI + World Bank
# inflation & GNI), and commits the regenerated data.js only when it changed.
# With GitHub Pages serving the repo, the public dashboard updates itself —
# no human in the loop. US CPI publishes monthly (~8:30am ET on release days),
# so a daily check catches every print within 24 hours.

name: Refresh live data

on:
  schedule:
    - cron: "45 13 * * *"   # daily 13:45 UTC (~9:45am ET, after CPI releases)
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data
        run: python fetch_cost_of_living.py

      - name: Commit data.js if it changed
        run: |
          git config user.name "col-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore: auto-refresh data ($(date -u +%F))"
            git push
          fi
